[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-backtester"
version = "0.1.0"
description = "Local crypto backtesting project skeleton."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0", "pyarrow>=15.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
crypto-backtester = "src.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
